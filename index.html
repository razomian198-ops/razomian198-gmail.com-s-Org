<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Defensive window.fetch accessor patch for preview iframe & inspector extension
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Graceful fallback if already writable
        }
      })();
    </script>
    <title>FactInfoLive – Global News, Live Sports & Science Intelligence</title>
    <meta name="description" content="Authentic global news coverage, real-time sports fixtures and scores, scientific research discoveries, and verified multi-perspective intelligence." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FactInfoLive" />
    <meta property="og:title" content="FactInfoLive – Global News, Live Sports & Science Intelligence" />
    <meta property="og:description" content="Authentic global news coverage, real-time sports fixtures and scores, scientific research discoveries, and verified multi-perspective intelligence." />
    <meta property="og:image" content="/og-preview.png" />
